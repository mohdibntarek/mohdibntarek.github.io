project:
  type: website
  output-dir: _site

execute:
  project:
    type: julia
  cache: true
    
website:
  title: "Back to Blog Posts"
  favicon: ../src/assets/text-documents-line-icon.png
  
  navbar:
    logo-href: "../../blog"
    search: false

format:
  html:
    number-sections: true
    toc: true
    code-copy: true
    code-fold: false
    code-tools: true
    include-in-header:
      - text: |
          <script defer src="https://cloud.umami.is/script.js" data-website-id="83603249-8763-4c0b-a83b-bf4adae042e8"></script>
          <style>
          .header-section-number::after { content: "."; }
          .header-section-number { color: oklch(45% 0.14 250); }
          [data-theme="dark"] .header-section-number { color: oklch(75% 0.1 250); }
          </style>
    include-before-body: 
      - text: |
          <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
          <script>
            // Theme initialization - runs immediately before Alpine loads
            (function() {
              const savedTheme = localStorage.getItem('theme-preference');
              const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
              const isDark = savedTheme ? savedTheme === 'dark' : systemDark;
              const theme = isDark ? 'dark' : 'light';
              document.documentElement.setAttribute('data-theme', theme);
              document.documentElement.setAttribute('data-bs-theme', theme);
              document.documentElement.style.colorScheme = theme;
            })();
          </script>
          <style>
            .theme-toggle {
              position: fixed;
              bottom: 1.25rem;
              right: 1.25rem;
              width: 44px;
              height: 44px;
              border: none;
              border-radius: 50%;
              background: #1a1a1a;
              color: white;
              cursor: pointer;
              transition: all 250ms ease;
              box-shadow: 0 2px 8px rgba(0,0,0,0.3);
              z-index: 1000;
              display: flex;
              align-items: center;
              justify-content: center;
              overflow: hidden;
            }
            
            [data-theme="light"] .theme-toggle {
              background: white;
              color: #1a1a1a;
              box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            }
            
            .theme-toggle:hover {
              transform: scale(1.1);
            }
            
            .theme-toggle:active {
              transform: scale(0.95);
            }
            
            .theme-toggle__icon {
              position: absolute;
              transition: opacity 250ms ease;
            }
          </style>
    include-after-body:
      - text: |
          <!-- Theme Toggle button with Alpine.js -->
          <button 
            class="theme-toggle" 
            aria-label="Toggle dark mode" 
            title="Toggle dark mode"
            x-data
            @click="$dispatch('theme-toggle')"
          >
            <span class="theme-toggle__icon theme-toggle__icon--sun" x-show="$store.theme.isDark" style="display: none;">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg>
            </span>
            <span class="theme-toggle__icon theme-toggle__icon--moon" x-show="!$store.theme.isDark">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </span>
          </button>
          <script>
            // Alpine.js theme store - syncs with Astro via localStorage
            document.addEventListener('alpine:init', () => {
              Alpine.store('theme', {
                isDark: document.documentElement.getAttribute('data-theme') === 'dark',
                
                toggle() {
                  this.isDark = !this.isDark;
                  const theme = this.isDark ? 'dark' : 'light';
                  document.documentElement.setAttribute('data-theme', theme);
                  document.documentElement.setAttribute('data-bs-theme', theme);
                  document.documentElement.style.colorScheme = theme;
                  localStorage.setItem('theme-preference', theme);
                }
              });
              
              // Listen for toggle events from button
              window.addEventListener('theme-toggle', () => {
                Alpine.store('theme').toggle();
              });
              
              // Listen for storage events from Astro pages
              window.addEventListener('storage', (e) => {
                if (e.key === 'theme-preference') {
                  const newTheme = e.newValue;
                  if (newTheme) {
                    Alpine.store('theme').isDark = newTheme === 'dark';
                    document.documentElement.setAttribute('data-theme', newTheme);
                    document.documentElement.setAttribute('data-bs-theme', newTheme);
                    document.documentElement.style.colorScheme = newTheme;
                  }
                }
              });
            });
            
            // Inline code background fix for dark mode (Quarto-specific)
            (function() {
              const updateInlineCodeBackground = function() {
                const isDark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
                const inlineCodeSelectors = [
                  'p code:not(.sourceCode)',
                  'li code:not(.sourceCode)',
                  'td code:not(.sourceCode)'
                ];
                
                inlineCodeSelectors.forEach(function(selector) {
                  const elements = document.querySelectorAll(selector);
                  elements.forEach(function(el) {
                    if (isDark) {
                      el.style.setProperty('background-color', 'rgba(70, 70, 75, 0.6)', 'important');
                      el.style.setProperty('color', '#ff6b6b', 'important');
                    } else {
                      el.style.removeProperty('background-color');
                      el.style.removeProperty('color');
                    }
                  });
                });
              };
              
              const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                  if (mutation.attributeName === 'data-bs-theme') {
                    updateInlineCodeBackground();
                  }
                });
              });
              
              observer.observe(document.documentElement, { attributes: true });
              updateInlineCodeBackground();
            })();
          </script>
