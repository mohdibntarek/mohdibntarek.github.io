name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [main]
  # Trigger the workflow on pull requests to the main branch (build only, no deploy)
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 'release'

      - name: Set R library path
        run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Set CURL_CA_BUNDLE for R on Ubuntu
        run: echo "CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> $GITHUB_ENV

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Julia packages
        uses: julia-actions/cache@v2
        with:
          cache-packages: 'true'
          cache-registries: 'true'
          cache-artifacts: 'true'
          cache-compiled: 'true'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Quarto installation
        id: cache-quarto
        uses: actions/cache@v4
        with:
          path: /opt/quarto
          key: ${{ runner.os }}-quarto-1.9.37
          restore-keys: |
            ${{ runner.os }}-quarto-

      - name: Install Quarto
        if: steps.cache-quarto.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.37/quarto-1.9.37-linux-amd64.deb
          sudo dpkg -i quarto-1.9.37-linux-amd64.deb

      - name: Add Quarto to PATH
        run: echo "/opt/quarto/bin" >> $GITHUB_PATH

      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/environments/*/CondaPkg
            quarto_blog/.CondaPkg
          key: ${{ runner.os }}-condapkg-${{ hashFiles('**/CondaPkg.toml', '**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-condapkg-

      - name: Cache Quarto render cache
        uses: actions/cache@v4
        with:
          path: |
            quarto_blog/_freeze
            quarto_blog/.quarto
          key: ${{ runner.os }}-quarto-freeze-${{ hashFiles('quarto_blog/**/*.qmd', 'quarto_blog/**/*.ipynb', 'quarto_blog/**/*.toml', 'quarto_blog/_quarto.yml') }}
          restore-keys: |
            ${{ runner.os }}-quarto-freeze-

      - name: Cleanup old builds
        run: rm -rf public/quarto_blog quarto_blog/_site

      - name: Render Quarto blogposts
        working-directory: ./quarto_blog
        env:
          JULIA_PROJECT: ${{ github.workspace }}/quarto_blog
        run: quarto render
      
      - name: Copy Quarto output to public directory
        run: |
          cp -r quarto_blog/_site public/quarto_blog
      
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          package-manager: bun@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
