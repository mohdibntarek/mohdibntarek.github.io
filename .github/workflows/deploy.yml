name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [main]
  # Trigger the workflow on pull requests to the main branch
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: 'release'
      - run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - uses: julia-actions/julia-buildpkg@v1
      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2
        with:
          cache-packages: 'true'
          cache-registries: 'true'
          cache-artifacts: 'true'
          cache-compiled: 'true'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Quarto installation
        id: cache-quarto
        uses: actions/cache@v4
        with:
          path: /opt/quarto
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/quarto-linux-amd64.deb') }}
          restore-keys: |
            ${{ runner.os }}-quarto-

      - name: Install Quarto
        if: steps.cache-quarto.outputs.cache-hit != 'true'
        run: |
          wget https://quarto.org/download/latest/quarto-linux-amd64.deb
          sudo dpkg -i quarto-linux-amd64.deb

      - name: Add Quarto to PATH (if cached)
        if: steps.cache-quarto.outputs.cache-hit == 'true'
        run: |
          echo "/opt/quarto/bin" >> $GITHUB_PATH

      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/environments/*/CondaPkg
            quarto_blog/.CondaPkg
          key: ${{ runner.os }}-condapkg-${{ hashFiles('**/CondaPkg.toml', '**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-condapkg-

      - name: Instantiate Julia environment
        run: |
          cd quarto_blog
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
      
      - name: Render Quarto blogposts
        env:
          JULIA_PROJECT: ${{ github.workspace }}/quarto_blog
        run: |
          cd quarto_blog
          quarto render
      
      - name: Copy Quarto output to public directory
        run: |
          rm -rf public/quarto_blog
          cp -r quarto_blog/_site public/quarto_blog
      
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
        # path: . # The root location of your Astro project inside the repository. (optional)
        # node-version: 20 # The specific version of Node that should be used to build your site. Defaults to 20. (optional)
        # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
